name: Build and test (no publication)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      VCPKG_MAX_CONCURRENCY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Prepare pinned SDK
        run: ./tools/bootstrap-public-build.ps1 -InstallMissingVisualStudioComponents
      - name: Build shader tools
        run: ./tools/c4-bootstrap.ps1
      - name: Build modified Columns UI
        run: ./tools/build-columns-ui.ps1
      - name: Install relay development dependencies
        working-directory: services/presence-relay
        run: npm ci
      - name: Build and deterministic native tests
        run: ./tools/test.ps1 -Configuration Release -UseWarp -SkipPerformanceGates
      - name: Relay type, protocol and authentication checks
        working-directory: services/presence-relay
        run: |
          npm run check
          npm audit --audit-level=high
